#MSSQL config
spring.datasource.url=jdbc:sqlserver://FA;databaseName=EmployeeManagement;integratedSecurity=true;encrypt=true;trustServerCertificate=true
#spring.datasource.url=jdbc:sqlserver://localhost;databaseName=EmployeeManagement;integratedSecurity=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

#When trying to connect go to sql server management - turn on tcp
#must download a dll file -sql eg.mssql-jdbc_auth-11.2.3.x64.dll



spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl